<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
:root { --bg: #fafafa; --fg: #1c1c1e; --muted: #6e6e73; --card: #fff; --line: #e5e5ea; }
@media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f2f2f7; --muted: #98989d; --card: #1c1c1e; --line: #2c2c2e; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 48px 16px 80px; }
h1 { font-size: 30px; margin: 0 0 24px; }
a.app { display: flex; align-items: center; gap: 14px; padding: 14px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
a.app img { width: 52px; height: 52px; border-radius: 12px; }
a.app span { color: var(--muted); font-size: 15px; display: block; }
</style>
</head>
<body><main>
<h1>Apps</h1>
<a class="app" href="hearth/"><img src="hearth/icon.png" alt=""><div><strong>Hearth</strong><span>Home inventory for insurance</span></div></a>
</main></body></html>
